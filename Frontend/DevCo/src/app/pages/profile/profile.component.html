<div class="mx-auto max-w-2xl px-4 py-8">
  <h1 class="text-xl font-semibold text-gray-900 mb-6">My Profile</h1>

  <app-loading *ngIf="loading" size="lg"></app-loading>

  <form
    *ngIf="!loading && user"
    [formGroup]="form"
    (ngSubmit)="save()"
    class="space-y-6 rounded-xl border border-gray-100 bg-white p-6 shadow-sm"
  >
    <!-- Avatar -->
    <div class="flex items-center gap-4">
      <img
        [src]="avatarPreview || user.avatar || 'https://ui-avatars.com/api/?name=' + user.name"
        class="h-16 w-16 rounded-full object-cover border border-gray-200"
        alt="Profile avatar"
      />
      <div>
        <label class="inline-block cursor-pointer rounded-lg border border-gray-200 px-3 py-1.5
                       text-sm font-medium text-gray-600 hover:bg-gray-50">
          Change photo
          <input type="file" accept="image/*" class="hidden" (change)="onAvatarSelected($event)" />
        </label>
        <p class="mt-1 text-xs text-gray-400">JPG or PNG, up to 2MB.</p>
      </div>
    </div>

    <!-- Name -->
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Name</label>
      <input
        type="text"
        formControlName="name"
        class="w-full rounded-lg border border-gray-200 px-3 py-2 text-sm
               focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 outline-none"
      />
      <p *ngIf="form.get('name')?.touched && form.get('name')?.invalid"
         class="mt-1 text-xs text-red-500">
        Name must be at least 2 characters.
      </p>
    </div>

    <!-- Email -->
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
      <input
        type="email"
        formControlName="email"
        readonly
        class="w-full rounded-lg border border-gray-200 bg-gray-50 px-3 py-2 text-sm
               text-gray-500 cursor-not-allowed outline-none"
      />
      <p class="mt-1 text-xs text-gray-400">
        Email changes require verification and aren't supported here yet.
      </p>
    </div>

    <!-- Bio -->
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Bio</label>
      <textarea
        formControlName="bio"
        rows="3"
        placeholder="Tell your team a bit about yourself"
        class="w-full rounded-lg border border-gray-200 px-3 py-2 text-sm
               focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 outline-none"
      ></textarea>
    </div>

    <p *ngIf="errorMessage" class="text-sm text-red-500">{{ errorMessage }}</p>
    <p *ngIf="successMessage" class="text-sm text-green-600">{{ successMessage }}</p>

    <div class="flex justify-end">
      <button
        type="submit"
        [disabled]="saving"
        class="rounded-lg bg-indigo-600 px-4 py-2 text-sm font-medium text-white
               hover:bg-indigo-700 disabled:opacity-60 transition-colors"
      >
        {{ saving ? 'Saving...' : 'Save changes' }}
      </button>
    </div>
  </form>
</div>
