<div class="notifications-page">
  <div class="page-header">
    <div>
      <h1>Notifications</h1>

      <p>Stay updated with your workspace and project activity.</p>
    </div>

    <button
      class="mark-all-btn"
      (click)="markAllAsRead()"
      [disabled]="!notifications.length"
    >
      Mark all as read
    </button>
  </div>

  <div class="loading" *ngIf="loading">Loading notifications...</div>

  <div class="empty-state" *ngIf="!loading && !notifications.length">
    <div class="empty-icon">◔</div>

    <h3>No notifications</h3>

    <p>You're all caught up.</p>
  </div>

  <div class="notifications-list" *ngIf="!loading && notifications.length">
    <div
      class="notification-item"
      *ngFor="let notification of notifications"
      [class.unread]="!notification.isRead"
      (click)="openNotification(notification)"
    >
      <div class="notification-icon">
        {{ getNotificationIcon(notification.type) }}
      </div>

      <div class="notification-content">
        <div class="notification-message">
          <strong *ngIf="notification.sender">
            {{ notification.sender.name }}
          </strong>

          {{ notification.message }}
        </div>

        <div class="notification-time">
          {{ notification.createdAt | date: "medium" }}
        </div>
      </div>

      <div class="unread-dot" *ngIf="!notification.isRead"></div>

      <button
        class="delete-btn"
        (click)="$event.stopPropagation(); deleteNotification(notification)"
      >
        ×
      </button>
    </div>
  </div>
</div>
