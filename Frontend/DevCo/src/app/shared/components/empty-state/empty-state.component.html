<div class="flex flex-col items-center justify-center text-center py-12 px-4">
  <div class="h-16 w-16 rounded-full bg-indigo-50 flex items-center justify-center mb-4">
    <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-indigo-400" fill="none"
         viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
      <path stroke-linecap="round" stroke-linejoin="round"
            d="M9 13h6m-3-3v6m9-3a9 9 0 11-18 0 9 9 0 0118 0z" />
    </svg>
  </div>
  <h3 class="text-base font-semibold text-gray-800">{{ title }}</h3>
  <p *ngIf="message" class="mt-1 text-sm text-gray-500 max-w-xs">{{ message }}</p>
  <button
    *ngIf="actionLabel"
    (click)="action.emit()"
    class="mt-4 inline-flex items-center rounded-lg bg-indigo-600 px-4 py-2 text-sm
           font-medium text-white hover:bg-indigo-700 transition-colors"
  >
    {{ actionLabel }}
  </button>
</div>
