<div
  [ngClass]="fullscreen ? 'fixed inset-0 z-50 bg-white/70' : 'py-6'"
  class="flex flex-col items-center justify-center gap-3"
>
  <div
    [ngClass]="{
      'h-4 w-4 border-2': size === 'sm',
      'h-8 w-8 border-2': size === 'md',
      'h-12 w-12 border-4': size === 'lg'
    }"
    class="animate-spin rounded-full border-indigo-600 border-t-transparent"
  ></div>
  <span *ngIf="size !== 'sm'" class="text-sm text-gray-500">{{ label }}</span>
</div>
