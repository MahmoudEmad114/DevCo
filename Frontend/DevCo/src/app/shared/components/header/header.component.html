<header class="header">
  <div class="header-left">
    <span class="page-label"> Workspace </span>
  </div>

  <div class="header-right">
    <button class="notification-btn" routerLink="/notifications">
      🔔
      <span class="notification-badge" *ngIf="unreadCount > 0">
        {{ unreadCount > 99 ? "99+" : unreadCount }}
      </span>
    </button>

    <div class="user-info">
      <img [src]="getUserPhoto(user?.photo)" [alt]="user?.name || 'User'" />

      <div class="user-text">
        <strong>
          {{ user?.name }}
        </strong>

        <span>
          {{ user?.role }}
        </span>
      </div>
    </div>

    <button class="logout-btn" (click)="logout()">Logout</button>
  </div>
</header>
