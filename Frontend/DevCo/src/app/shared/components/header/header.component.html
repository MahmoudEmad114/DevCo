<header class="flex items-center justify-between border-b border-gray-100 bg-white px-4 py-3 sm:px-6">
  <div class="flex items-center gap-3">
    <button
      (click)="toggleSidebar.emit()"
      class="rounded-lg p-2 text-gray-500 hover:bg-gray-100 lg:hidden"
      aria-label="Toggle sidebar"
    >
      <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none"
           viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" />
      </svg>
    </button>
    <span class="text-lg font-semibold text-indigo-600">DevCollab</span>
  </div>

  <div class="flex items-center gap-4">
    <a routerLink="/notifications" class="relative rounded-lg p-2 text-gray-500 hover:bg-gray-100">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none"
           viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round"
              d="M15 17h5l-1.4-1.4A2 2 0 0118 14.2V11a6 6 0 10-12 0v3.2a2 2 0 01-.6 1.4L4 17h5m6 0a3 3 0 11-6 0" />
      </svg>
      <span
        *ngIf="unreadNotifications > 0"
        class="absolute -top-0.5 -right-0.5 flex h-4 w-4 items-center justify-center
               rounded-full bg-red-500 text-[10px] font-medium text-white"
      >
        {{ unreadNotifications > 9 ? '9+' : unreadNotifications }}
      </span>
    </a>

    <div class="relative">
      <button (click)="toggleMenu()" class="flex items-center gap-2">
        <img
          [src]="currentUser?.avatar || 'https://ui-avatars.com/api/?name=' + (currentUser?.name || 'U')"
          class="h-8 w-8 rounded-full object-cover border border-gray-200"
          [alt]="currentUser?.name || 'User avatar'"
        />
      </button>

      <div
        *ngIf="menuOpen"
        class="absolute right-0 mt-2 w-44 rounded-lg border border-gray-100 bg-white py-1 shadow-lg z-10"
      >
        <a routerLink="/profile" (click)="menuOpen = false"
           class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-50">Profile</a>
        <button (click)="logout.emit(); menuOpen = false"
                class="w-full text-left px-4 py-2 text-sm text-red-600 hover:bg-gray-50">
          Log out
        </button>
      </div>
    </div>
  </div>
</header>
